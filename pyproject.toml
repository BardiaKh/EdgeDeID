[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edgedeid"
version = "0.3.0"
description = "EdgeDeID — edge-deployable PHI de-identification: multi-teacher distillation, recall-floor QC, and GRPO-trained metacognitive self-checking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Synthetic data generation
    "anthropic>=0.72.0",
    "openai>=1.0.0",
    "radprompter>=0.1.0",
    # Data processing / augmentation
    "pandas>=2.0",
    "beautifulsoup4>=4.13.5",
    "lxml>=6.0.1",
    "levenshtein>=0.27.1",
    "tqdm>=4.66",
    # Training (SFT)
    # NOTE: vLLM extra dropped — GRPO/SFT use the HF generation backend, not a
    # vLLM server. transformers pinned <5 because trl 0.23.1 reads transformers'
    # _is_package_available(), whose default return type changed to a tuple in
    # transformers 5.x and breaks trl's vllm/availability gating.
    "trl>=0.23.0",
    "transformers>=4.56.1,<5",
    "accelerate>=1.0",
    "datasets>=3.0",
    "torch>=2.4",
    "liger-kernel>=0.6.2",
    "wandb>=0.21.4",
    # Demo
    "gradio>=5.46.0",
    "rich>=13.0",
    # Plotting / eval
    "matplotlib>=3.10.6",
    "plotly>=6.3.0",
    "openpyxl>=3.1.5",
    # Notebook tooling
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "nbformat>=5.10.4",
]

[project.optional-dependencies]
# flash-attn requires a CUDA toolchain; install via `uv sync --extra flash` if
# you have a working NVCC + matching torch.
flash = ["flash-attn>=2.8.3"]
# Baseline comparison models (evals/baselines/baselines.ipynb).
baselines = ["gliner>=0.2", "presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]

[tool.setuptools.packages.find]
include = ["edgedeid*"]
